<!doctype html>
<html><head><meta charset="utf-8"><style>html,body{margin:0;background:#000;overflow:hidden}canvas{display:block}</style></head>
<body><canvas id="c" width="1920" height="1080"></canvas>
<script>
const c = document.getElementById('c'), ctx = c.getContext('2d');
window.ready = document.fonts.ready.then(()=>true);
window.renderFrame = (t)=>{
  ctx.clearRect(0,0,1920,1080);
  const g = ctx.createRadialGradient(960,540,100,960,540,1100);
  g.addColorStop(0,'#14343a'); g.addColorStop(1,'#050607');
  ctx.fillStyle=g; ctx.fillRect(0,0,1920,1080);
  ctx.save();
  ctx.filter='blur(28px)';
  for(let i=0;i<14;i++){
    const y = 140 + i*48 + Math.sin(t*1.7+i)*22;
    ctx.fillStyle = `rgba(${20+i*4},${200-i*6},${160+i*4},0.55)`;
    ctx.fillRect(200, y, 1520, 3);
  }
  ctx.restore();
  ctx.filter='none';
  ctx.font='700 96px "Noto Serif SC"';
  ctx.fillStyle='#f4efe6';
  ctx.fillText('视频会划走', 200, 420);
  ctx.font='700 96px "HarmonyOS Sans SC"';
  ctx.fillStyle='#2fe3b8';
  ctx.fillText('谱子会留下', 200, 560);
  // noise
  const img = ctx.getImageData(0,0,1920,1080);
  return t;
};
</script></body></html>
